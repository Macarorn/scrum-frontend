server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # DigitalOcean App Platform ya se encarga de la compresión gzip automáticamente.
    # Tenerlo encendido aquí puede causar ERR_HTTP2_PROTOCOL_ERROR por conflictos de cabeceras.
    gzip off;

    # Cache de archivos estáticos (JS, CSS, imágenes)
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: redirige todas las rutas a index.html para React Router
    location / {
        try_files $uri $uri/ /index.html;
        
        # No cachear index.html para evitar problemas de actualización
        if ($uri = /index.html) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Retornar 404 para assets estáticos faltantes en lugar de servir index.html
    location ~ ^/assets/ {
        try_files $uri =404;
    }

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
